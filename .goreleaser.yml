project_name: postbode
version: 2

builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like Terraform Cloud where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    # DEVIATION from template-go-app (Phase 16 plan, deliberate): darwin only,
    # not windows/linux. Postbode shells out to `osascript` and `launchctl`,
    # stores secrets in the macOS Keychain via `/usr/bin/security`, and installs
    # itself as a launchd LaunchAgent. A Linux or Windows binary would build
    # cleanly and then fail at first run — shipping one is a promise the
    # product cannot keep, so those targets are omitted entirely.
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/postbode
    binary: '{{ .ProjectName }}'
snapshot:
  version_template: '{{ incpatch .Version }}'
archives:
  - formats:
    - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this is a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate it's not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  draft: false
changelog:
  use: git # or remove below and just use: github-native
  filters:
    include:
      - "^feat:"
      - "^fix:"
      - "^chore:"
      - "^docs:"
  sort: asc # Sort commits chronologically (oldest to newest)
  groups:   # organize your changelog into categories using regular expressions, start commit with feat: or fix:
    # https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional
    - title: '🛠 Dependency updates'
      regexp: '^fix\(deps\):|^feat\(deps\):'
      order: 300
    - title: '✨ New Features'
      regexp: '^feat(\([^)]*\))?:'
      order: 100
    - title: '🐛 Bug fixes'
      regexp: '^fix(\([^)]*\))?:'
      order: 200
    - title: '📖 Documentation updates'
      regexp: '^docs(\([^)]*\))?:'
      order: 400
    - title: '🛡️ Security updates'
      regexp: '^sec(\([^)]*\))?:'
      order: 500
    - title: '🚀 Build process updates'
      regexp: '^(build|ci)(\([^)]*\))?:'
      order: 600
    - title: '📦 Other work'
      regexp: '^chore(\([^)]*\))?:|^chore:'
      order: 9999

# To check deprecations:
# https://goreleaser.com/deprecations/

# Homebrew: deliberately NOT using goreleaser's `brews:` push.
#
# vhco-pro/homebrew-tap pulls rather than being pushed to — its sync
# workflows watch a source repo's latest release and bump the formula with
# the tap's OWN github.token ("no cross-repo app/PAT/deploy-key needed",
# per sync-cask.yml). Pushing from here would reintroduce exactly the
# cross-repo credential that pattern exists to avoid, so the formula and
# its sync workflow live in the tap instead. See Formula/postbode.rb there.
