schema_version: 2
# framework_version: the Vega framework semver this constitution was written against.
framework_version: "0.14.5"

# This is a personal OSS repo, not an Engie platform workload. It has no GitOps
# overlays, no secret manager, no cluster bindings, so those blocks are omitted
# on purpose: read-constitution reports them as "n/a" and no agent should ask.
# Only the SDD loop (spec -> plan -> implement -> review) applies here.

repo:
  archetype: "go-daemon"
  language: "go"
  workload_name: "postbode"

# A single static macOS binary installed as a launchd LaunchAgent and
# distributed through the vhco-pro Homebrew tap. Explicitly NOT a container:
# it reads the macOS Keychain, shells out to osascript and launchctl, and
# talks to the user's own notification centre (spec §9, out of scope).
artifact:
  kind: "binary"
  target_platform: "darwin/arm64,darwin/amd64"
  deploy_unit: "launchd-launchagent"
  distribution: "homebrew-tap"
  tap_repo: "vhco-pro/homebrew-tap"

workflow:
  spec_mode: "assisted"
  quality_gates: "harvest"
  diagrams: true
  token_efficiency: "rtk"
